services:
  - type: web
    name: krishimitra-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: krishimitra-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: krishimitra-db
          property: connectionString

databases:
  - name: krishimitra-db
    databaseName: krishimitra
    user: krishimitra_user
    plan: free
